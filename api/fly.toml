# fly.toml app configuration file generated for coaches-station-api on 2026-07-30T07:50:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coaches-station-api'
primary_region = 'ord'

[build]

[env]
  DB_PATH = '/data/nhl.db'
  SHOOTOUT_DB_PATH = '/data/shootout.db'

[mounts]
  source = 'nhl_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024